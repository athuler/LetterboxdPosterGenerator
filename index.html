<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letterboxd Poster Generator</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --fg: #1b1b1b; --muted: #666; --line: #ddd; --accent: #00a35c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181c; --panel: #1f252b; --fg: #e8e8e8; --muted: #9aa3ab; --line: #333b43; --accent: #00c76e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  a { color: var(--accent); }
  header, footer { padding: 16px; }
  header h1 { margin: 0; font-size: 22px; }
  footer { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 0 16px; align-items: start; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  /* min-width: 0 lets grid columns shrink below their content (e.g. a select sized to a very long list name). */
  section { min-width: 0; }
  input[type=text], input[type=search], select { width: 100%; min-width: 0; text-overflow: ellipsis; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .controls { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=text], input[type=search], input[type=number], input[type=color], select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row label { display: flex; gap: 6px; align-items: center; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; cursor: pointer; }
  #drop.over, body.over #drop { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #status { color: var(--muted); min-height: 1.4em; margin: 0; }
  #results { display: grid; gap: 4px; }
  #results button { display: flex; gap: 8px; align-items: center; text-align: left; }
  #results img { width: 30px; height: 45px; object-fit: cover; background: var(--line); }
  .preview { display: grid; gap: 12px; position: sticky; top: 16px; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
  /* Invisible tiles laid over each drawn poster for editing. */
  .tile { position: absolute; cursor: grab; border-radius: 3px; outline-offset: 2px; }
  .tile:hover, .tile:focus-visible { outline: 3px solid var(--accent); }
  .tile.dragging { opacity: .4; background: var(--bg); }
  .tile button { position: absolute; top: 4px; right: 4px; padding: 0 6px; line-height: 1.6;
    background: rgba(0,0,0,.75); color: #fff; border: 0; border-radius: 50%; opacity: 0; }
  .tile:hover button, .tile:focus-within button { opacity: 1; }
  @media (hover: none) { .tile button { opacity: .85; } }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  [hidden] { display: none !important; } /* #drop etc. set display, which would otherwise beat the hidden attribute */
  #picker { display: grid; gap: 12px; }
  #loaded { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #loaded-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #unload { padding: 2px 8px; }
  /* Recent uploads: deliberately quiet, plain muted text links rather than buttons. */
  #recent { color: var(--muted); font-size: 13px; }
  #recent-list { list-style: none; margin: 2px 0 0; padding: 0; }
  #recent-list li { display: flex; align-items: center; }
  #recent-list button { background: none; border: 0; border-radius: 4px; color: inherit; font-size: inherit; padding: 2px 4px; }
  #recent-list button:hover, #recent-list button:focus-visible { color: var(--fg); background: var(--bg); }
  .recent-open { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header><h1>Letterboxd Poster Generator</h1></header>
<main>
  <section class="controls">
    <div id="picker">
      <label id="drop" for="file">
        Drop your Letterboxd export <b>.zip</b> here, or click to choose it.
        <small>Get it at <a href="https://letterboxd.com/data/export/" target="_blank" rel="noopener">letterboxd.com/data/export</a>. It never leaves your browser.</small>
      </label>
      <div id="recent" hidden>
        Recent uploads
        <ul id="recent-list"></ul>
      </div>
    </div>
    <input id="file" type="file" accept=".zip,application/zip" hidden>
    <div id="loaded" hidden>
      <span id="loaded-name"></span>
      <button id="unload" type="button" aria-label="Unload this export">✕</button>
    </div>
    <p id="status" role="status"></p>

    <label><span id="lists-label">Lists</span>
      <select id="source"><option value="">Start empty</option></select>
    </label>
    <label>Poster title <input id="title" type="text" placeholder="Optional"></label>
    <label>Poster size
      <!-- value = height / width; empty = grow to fit the films -->
      <select id="size">
        <option value="">Fit to films</option>
        <option value="1.4142">A4, A3, A2, … portrait</option>
        <option value="0.7071">A4, A3, A2, … landscape</option>
        <option value="1.2941">Letter (8.5×11 in) portrait</option>
        <option value="0.7727">Letter (8.5×11 in) landscape</option>
        <option value="1.5">2:3 portrait</option>
        <option value="1.3333">3:4 portrait</option>
        <option value="1.25">4:5 portrait</option>
        <option value="1.5455">11×17 in</option>
        <option value="1">Square</option>
        <option value="0.5625">Desktop wallpaper (16:9)</option>
        <option value="2.1667">Phone wallpaper (9:19.5)</option>
      </select>
    </label>
    <div class="row">
      <label>Columns <input id="cols" type="number" min="2" value="5" style="width:4.5em"></label>
      <label><input id="captions" type="checkbox" checked> Captions</label>
      <label>Background <input id="bg" type="color" value="#14181c"></label>
    </div>

    <label>Add a film <input id="search" type="search" placeholder="Search TMDB…" autocomplete="off"></label>
    <div id="results"></div>

    <label>Sort
      <select id="sort">
        <option value="list">List order</option>
        <option value="custom">Custom (drag to arrange)</option>
        <option value="title">Title A–Z</option>
        <option value="year-asc">Year: oldest first</option>
        <option value="year-desc">Year: newest first</option>
        <option value="rating">Rating: highest first</option>
        <option value="date-desc">Date logged: newest first</option>
        <option value="date-asc">Date logged: oldest first</option>
        <option value="shuffle">Shuffle</option>
      </select>
    </label>
    <div class="row"><button id="clear" type="button">Clear</button></div>
  </section>

  <section class="preview">
    <div id="stage">
      <canvas id="poster" aria-label="Poster preview"></canvas>
      <div id="tiles"></div>
    </div>
    <p class="hint">Drag posters to reorder. Hover or tap one for ✕ to remove it. Keyboard: Tab to a poster, then arrow keys or Delete.</p>
    <button id="download" class="primary" type="button">Download PNG</button>
  </section>
</main>
<footer>
  This product uses the TMDB API but is not endorsed or certified by TMDB. Not affiliated with Letterboxd.
</footer>
</body>
</html>
