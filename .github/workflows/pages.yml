name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  # Builds the site artifact. Kept apart from `deploy` so "Re-run failed jobs" on a failed deploy
  # reuses this artifact instead of uploading a second one (deploy-pages refuses duplicates).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Only the site goes live: not the tests, the Worker or tooling files.
      - name: Collect site files
        run: |
          rsync -a ./ _site/ --exclude-from=- <<'EOF'
          .git
          .github
          .gitignore
          _site
          tests
          tests.html
          worker
          node_modules
          package.json
          package-lock.json
          playwright.config.js
          test-results
          playwright-report
          config.local.js
          README.md
          EOF
          ls -R _site
      # Google Analytics goes into the deployed page only, so local copies and forks stay untracked.
      # Set the repository variable GA_MEASUREMENT_ID (e.g. G-ABC123XYZ) to turn it on.
      - name: Inject Google Analytics
        if: vars.GA_MEASUREMENT_ID != ''
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          [[ "$GA_ID" =~ ^G-[A-Z0-9]+$ ]] || { echo "GA_MEASUREMENT_ID must look like G-XXXXXXX"; exit 1; }
          snippet="<script async src=\"https://www.googletagmanager.com/gtag/js?id=$GA_ID\"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','$GA_ID');</script>"
          grep -q '</head>' _site/index.html
          sed -i "s#</head>#$snippet\n</head>#" _site/index.html
          grep -c "gtag/js?id=$GA_ID" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: [test, build] # a failing test blocks the deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
